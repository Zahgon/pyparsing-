name: Continuous Integration
on:
  push:
    branches:
      - master

  pull_request:
    paths:
      - .github/workflows/ci.yml
      - '**.go'
      - go.mod

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...
